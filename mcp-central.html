<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#42334e"><title>新都城二期 · Agentopia</title>
<link rel="stylesheet" href="assets/mcp-central/map.css">
</head>
<body>
<header class="topbar">
 <a class="back" href="index.html#polam" aria-label="返回宝琳地图">← <span>宝琳</span></a>
 <div class="brand"><span class="brand-star">✦</span><div>Agentopia<small>HONG KONG · INTERIORS</small></div></div>
 <div class="floor-badge"><span class="live-dot"></span>L1 <span class="floor-word">一楼</span></div>
 <button class="icon-button" id="directoryToggle" aria-label="商铺目录" aria-expanded="false" aria-controls="directory">☰ <span>商铺目录</span></button>
</header>
<main class="workspace">
 <aside class="directory" id="directory" aria-label="商铺目录" hidden>
  <div class="directory-heading"><div><span class="eyebrow">SHOP DIRECTORY</span><h2>逛逛这一层</h2></div><button class="icon-button" id="directoryClose" aria-label="关闭目录">×</button></div>
  <label class="search-label" for="shopSearch">商铺名称 / 铺号</label><input id="shopSearch" type="search" placeholder="例如：ZARA、周大福、1025" autocomplete="off">
  <div class="filters" id="filters" aria-label="店铺类别"></div><p class="result-count" id="resultCount" aria-live="polite"></p><div class="shop-list" id="shopList"></div>
 </aside>
 <section class="explorer" aria-label="新都城二期游戏地图">
  <div class="map-heading"><div><span class="eyebrow">PO LAM / MCP CENTRAL</span><h1>新都城二期 <span>天幕广场</span></h1></div><span class="level-pill">LEVEL 1</span></div>
  <div class="viewport" id="viewport" tabindex="0" aria-label="可滚动的商场地图，使用方向键或拖动浏览">
   <div class="map-size" id="mapSize"><div class="world" id="world">
    <div class="floor-outline"></div><div class="carpet carpet-west"></div><div class="carpet carpet-east"></div>
    <div class="atrium"><div class="atrium-pattern"></div><div class="atrium-label"><span>✦</span><strong>天幕广场</strong><small>ATRIUM A + B</small></div></div>
    <div class="bridge bridge-west"><span>← 宝林邨 · 英明苑</span></div>
    <div class="bridge bridge-north"><span>↑ 欣明苑</span></div>
    <div class="bridge bridge-south"><span>↓ 宝琳站 · 三期</span></div>
    <div class="bridge bridge-southeast"><span>↓ 宝琳站 · 一期</span></div>
    <div class="wayfinding west-sign">西翼 WEST WING</div><div class="wayfinding east-sign">东翼 EAST WING</div>
    <div id="scenery" aria-hidden="true"></div><div id="rooms"></div>
    <div class="player" id="player" aria-hidden="true"><svg viewBox="0 0 16 24" shape-rendering="crispEdges"><ellipse cx="8" cy="22" rx="7" ry="2" fill="#46324255"/><path d="M4 18h3v4H4zm6 0h3v4h-3" fill="#554552"/><path d="M3 11h10v8H3z" fill="#ab82c8"/><path d="M1 12h2v6H1zm12 0h2v6h-2" fill="#efbf98"/><path d="M4 4h8v8H4z" fill="#efbf98"/><path d="M3 3h10v3H3zM5 1h6v2H5z" fill="#73594e"/><path d="M5 7h2v2H5zm5 0h2v2h-2" fill="#443342"/><path d="M3 11h10v3H3z" fill="#e8a6b7"/></svg><span>你在这里</span></div>
   </div></div>
  </div>
  <div class="map-tools" aria-label="地图缩放"><button id="zoomOut" aria-label="缩小地图">−</button><output id="zoomValue">60%</output><button id="zoomIn" aria-label="放大地图">＋</button><span></span><button id="fitMap">全览</button><button id="centerMap">中庭</button></div>
  <div class="map-status"><span><i class="status-dot"></i>拖动地图探索 · 点店名查看</span><button id="sourceButton">地图说明 ↗</button></div>
 </section>
</main>
<dialog id="shopDialog" class="shop-dialog" aria-labelledby="shopName">
 <button class="dialog-close" id="shopClose" aria-label="关闭商铺详情">×</button>
 <div class="shop-preview"><img src="assets/mcp-central/shop-room.png" alt="通用像素风店铺内景"><span class="preview-label">L1 · MCP CENTRAL</span></div>
 <div class="shop-copy"><span class="eyebrow" id="shopCategory"></span><h2 id="shopName"></h2><p id="shopUnit"></p><p class="shop-note" id="shopNote"></p><button class="primary-button" id="locateShop">在地图上定位 ↗</button></div>
</dialog>
<dialog id="sourceDialog" class="source-dialog" aria-label="关于这一层"><h2>关于这一层</h2><p id="sourceNotice"></p><p>当前制作 L1 天幕广场。其余楼层尚未制作。店铺使用统一中性内景，商铺名称独立显示。</p><a id="sourceLink" target="_blank" rel="noopener">查看官方参考平面图 ↗</a><form method="dialog"><button class="primary-button">知道了</button></form></dialog>
<script src="assets/mcp-central/shops.js"></script><script src="assets/mcp-central/map.js"></script>
</body></html>
